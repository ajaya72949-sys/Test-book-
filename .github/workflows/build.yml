name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Cordova APK with Hindi Name & Custom Icon
      run: |
        npm install -g cordova
        # 'VidyaTest' की जगह नाम 'विद्याTest' कर दिया गया है
        cordova create app com.vidyatest.app "विद्याTest"
        cp index.html app/www/index.html
        
        # Copy Icon to Cordova res folder
        if [ -f "icon.png" ]; then
          mkdir -p app/res
          cp icon.png app/res/icon.png
          echo '<icon src="res/icon.png" />' >> app/config.xml
        fi
        
        cd app
        cordova platform add android
        cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VidyaTest-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
