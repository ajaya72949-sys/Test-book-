name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Cordova APK
      run: |
        npm install -g cordova
        cordova create app com.vidyatest.app VidyaTest
        
        # HTML और PNG लोगो कॉपी करें
        if [ -f "index.html" ]; then cp index.html app/www/index.html; fi
        if [ -f "VidyaTest_logo_512x512.png" ]; then
          cp VidyaTest_logo_512x512.png app/www/VidyaTest_logo_512x512.png
          cp VidyaTest_logo_512x512.png app/www/icon.png
        fi
        
        # Python की मदद से नाम और ऐप का आइकन सुरक्षित रूप से सेट करें
        python3 -c '
        with open("app/config.xml", "r") as f:
            content = f.read()
        
        # नाम बदलें
        import re
        content = re.sub(r"<name>.*?</name>", "<name>विद्याTest</name>", content)
        
        # ऐप आइकन का टैग जोड़ें
        icon_tag = "    <icon src=\"www/icon.png\" />\n"
        content = content.replace("</widget>", icon_tag + "</widget>")
        
        with open("app/config.xml", "w") as f:
            f.write(content)
        '
        
        cd app
        cordova platform add android
        cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VidyaTest-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
